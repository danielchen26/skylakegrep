name: Release to PyPI

# On tag push (vX.Y.Z), build sdist + wheel and upload to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC), not a long-lived PyPI API token.
# One-time PyPI project setup required:
#   publisher: GitHub
#   owner: danielchen26
#   repository: skylakegrep
#   workflow: release.yml
#   environment: pypi
#
# This workflow does NOT trigger on master pushes. The author still
# controls when a release happens by tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/skylakegrep/
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF##*/}"
          ver=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$tag" != "v$ver" ]; then
            echo "Tag $tag does not match pyproject version $ver"
            exit 1
          fi
          echo "Tag $tag matches pyproject version $ver"

      - name: Build distributions
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
