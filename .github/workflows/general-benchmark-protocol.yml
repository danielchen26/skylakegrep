name: General Benchmark v2 Protocol

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: general-benchmark-v2-protocol
  cancel-in-progress: false

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark]"

      - name: Validate all public pins and evidence fixtures
        run: |
          python benchmarks/validate_public_fixtures.py \
            --oss-root /tmp/skygrep-general-v2-repos \
            --prepare \
            > /tmp/general-protocol-fixtures.json

      - name: Test statistics, receipt merging, source gates, and capacity gates
        run: |
          python -m pytest -q \
            tests/test_general_benchmark.py \
            tests/test_closed_loop_regression_gate.py

      - name: Scan protocol artifact for private material
        run: |
          python scripts/privacy_release_scan.py \
            /tmp/general-protocol-fixtures.json

      - name: Upload protocol receipt
        uses: actions/upload-artifact@v7
        with:
          name: skygrep-general-v2-protocol
          path: /tmp/general-protocol-fixtures.json
          if-no-files-found: error
          retention-days: 30
