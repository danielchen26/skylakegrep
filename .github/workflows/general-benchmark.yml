name: General Benchmark v2 (accelerated)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: general-benchmark-v2
  cancel-in-progress: false

# The full six-index run deliberately targets an explicitly provisioned
# accelerator. Standard GitHub-hosted CPU runners are covered by the separate
# weekly protocol workflow; they cannot finish the pinned bge-m3 corpus inside
# the benchmark timeout.
jobs:
  capacity-cobra:
    runs-on: [self-hosted, skygrep-benchmark]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify benchmark runner prerequisites
        run: |
          command -v rg
          command -v ollama
          curl --version

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark]"

      - name: Start local embedding service
        run: |
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            ollama serve > /tmp/skygrep-ollama-cobra.log 2>&1 &
          else
            : > /tmp/skygrep-ollama-cobra.log
          fi
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            echo "waiting for Ollama (${attempt}/30)"
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull bge-m3

      - name: Run fresh Cobra capacity reference
        run: |
          python benchmarks/universal_closed_loop_benchmark.py \
            --repo cobra \
            --oss-root /tmp/skygrep-general-v2-repos \
            --prepare \
            --refresh-index \
            --reset-index \
            --index-timeout 18000 \
            --trials 3 \
            --tokenizer tiktoken \
            --report /tmp/general-cobra.json \
            > /tmp/general-cobra.stdout.txt

      - name: Project full-matrix runner capacity
        run: |
          python benchmarks/general_capacity_preflight.py \
            --cobra-receipt /tmp/general-cobra.json \
            --oss-root /tmp/skygrep-general-v2-repos \
            --prepare \
            --max-index-seconds 18000 \
            --report /tmp/general-capacity.json \
            > /tmp/general-capacity.stdout.json

      - name: Scan capacity artifacts for private material
        id: privacy_scan
        if: always()
        run: |
          python scripts/privacy_release_scan.py \
            /tmp/general-cobra.json \
            /tmp/general-cobra.stdout.txt \
            /tmp/general-capacity.json \
            /tmp/general-capacity.stdout.json \
            /tmp/skygrep-ollama-cobra.log

      - name: Upload Cobra and capacity receipts
        if: ${{ always() && steps.privacy_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: general-v2-cobra
          path: |
            /tmp/general-cobra.json
            /tmp/general-cobra.stdout.txt
            /tmp/general-capacity.json
            /tmp/general-capacity.stdout.json
            /tmp/skygrep-ollama-cobra.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce runner capacity before the five large indexes
        run: jq -e '.capacity_gate.passed == true' /tmp/general-capacity.json

  repo-benchmark:
    needs: capacity-cobra
    runs-on: [self-hosted, skygrep-benchmark]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        repo: [django, react, spring-framework, tokio, vite]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify benchmark runner prerequisites
        run: |
          command -v rg
          command -v ollama
          curl --version

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark]"

      - name: Start local embedding service
        run: |
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            ollama serve > "/tmp/skygrep-ollama-${{ matrix.repo }}.log" 2>&1 &
          else
            : > "/tmp/skygrep-ollama-${{ matrix.repo }}.log"
          fi
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            echo "waiting for Ollama (${attempt}/30)"
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull bge-m3

      - name: Validate pinned public fixture
        run: |
          python benchmarks/validate_public_fixtures.py \
            --oss-root /tmp/skygrep-general-v2-repos \
            --repo "${{ matrix.repo }}" \
            --prepare

      - name: Run paired repository benchmark
        run: |
          python benchmarks/universal_closed_loop_benchmark.py \
            --repo "${{ matrix.repo }}" \
            --oss-root /tmp/skygrep-general-v2-repos \
            --prepare \
            --refresh-index \
            --reset-index \
            --index-timeout 18000 \
            --trials 3 \
            --tokenizer tiktoken \
            --report "/tmp/general-${{ matrix.repo }}.json" \
            > "/tmp/general-${{ matrix.repo }}.stdout.txt"

      - name: Scan repository artifacts for private material
        id: privacy_scan
        if: always()
        run: |
          python scripts/privacy_release_scan.py \
            "/tmp/general-${{ matrix.repo }}.json" \
            "/tmp/general-${{ matrix.repo }}.stdout.txt" \
            "/tmp/skygrep-ollama-${{ matrix.repo }}.log"

      - name: Upload repository receipt
        if: ${{ always() && steps.privacy_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: "general-v2-${{ matrix.repo }}"
          path: |
            /tmp/general-${{ matrix.repo }}.json
            /tmp/general-${{ matrix.repo }}.stdout.txt
            /tmp/skygrep-ollama-${{ matrix.repo }}.log
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [capacity-cobra, repo-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: pip install -e ".[benchmark]"

      - name: Download repository receipts
        uses: actions/download-artifact@v8
        with:
          pattern: general-v2-*
          path: /tmp/general-inputs
          merge-multiple: true

      - name: Merge paired receipts
        run: |
          python benchmarks/merge_general_reports.py \
            /tmp/general-inputs/general-cobra.json \
            /tmp/general-inputs/general-django.json \
            /tmp/general-inputs/general-react.json \
            /tmp/general-inputs/general-spring-framework.json \
            /tmp/general-inputs/general-tokio.json \
            /tmp/general-inputs/general-vite.json \
            --output /tmp/skygrep-general-v2.json \
            > /tmp/skygrep-general-v2.stdout.json

      - name: Enforce quality before efficiency
        run: |
          python benchmarks/closed_loop_regression_gate.py \
            /tmp/skygrep-general-v2.json \
            --require-general-reportable \
            --min-skygrep-path-coverage 0 \
            --min-skygrep-evidence-coverage 0 \
            --min-skygrep-sufficiency 0 \
            --min-context-reduction 0 \
            --min-estimated-agent-elapsed-reduction 0 \
            --min-work-quality-per-minute-ratio 0 \
            --max-completed-task-regression 999 \
            --min-general-eligible-fraction 0.80 \
            --min-general-median-context-reduction 1.0 \
            --min-general-context-ci-low 1.0 \
            --min-general-median-measured-elapsed-ratio 0.8 \
            --max-general-median-elapsed-delta-seconds 1.0

      - name: Scan merged artifacts for private material
        id: privacy_scan
        if: always()
        run: |
          python scripts/privacy_release_scan.py \
            /tmp/skygrep-general-v2.json \
            /tmp/skygrep-general-v2.stdout.json

      - name: Upload merged benchmark receipt
        if: ${{ always() && steps.privacy_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: skygrep-general-benchmark-v2
          path: |
            /tmp/skygrep-general-v2.json
            /tmp/skygrep-general-v2.stdout.json
          if-no-files-found: warn
          retention-days: 30
