[package]
name = "skygrep-desktop"
version = "0.1.0"
description = "Skygrep Desktop agent overlay"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "skygrep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
skygrep-agent = { path = "../../../crates/skygrep-agent" }
skygrep-core = { path = "../../../crates/skygrep-core" }
skygrep-protocol = { path = "../../../crates/skygrep-protocol" }
tauri = { version = "2.11.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
tokio = { version = "1.48.0", features = ["macros", "time"] }
