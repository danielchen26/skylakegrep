[project]
name = "skylakegrep"
version = "0.5.3"
description = "Fully-offline semantic search over your local files — powered by Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.0",
    "requests>=2.31",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pygments>=2.0",
    "pypdf>=3.0",
    "python-docx>=1.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
skygrep = "skylakegrep.src.cli:main"

[project.urls]
Homepage = "https://github.com/danielchen26/skylakegrep"
Repository = "https://github.com/danielchen26/skylakegrep"
Issues = "https://github.com/danielchen26/skylakegrep/issues"
Documentation = "https://danielchen26.github.io/skylakegrep/"

[tool.setuptools.packages.find]
where = ["."]
include = ["skylakegrep*"]
