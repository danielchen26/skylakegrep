[project]
name = "skylakegrep"
version = "0.7.0"
description = "Fully-offline semantic search over your local files — powered by Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tianchi Chen", email = "chentianchi@gmail.com" }]
maintainers = [{ name = "Tianchi Chen", email = "chentianchi@gmail.com" }]
keywords = [
    "semantic-search",
    "code-search",
    "local-first",
    "offline",
    "embeddings",
    "vector-search",
    "retrieval-augmented-generation",
    "ollama",
    "cli",
    "mcp",
    "model-context-protocol",
    "agent-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "requests>=2.31",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pygments>=2.0",
    "pypdf>=3.0",
    "python-docx>=1.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
]
benchmark = [
    "tiktoken>=0.7",
]

[build-system]
# setuptools >= 77 is required for the PEP 639 `license` SPDX expression
# and `license-files`; older versions silently fall back to dumping the
# whole licence text into the metadata `License:` field.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
skygrep = "skylakegrep.src.cli:main"

[project.urls]
Homepage = "https://github.com/danielchen26/skylakegrep"
Repository = "https://github.com/danielchen26/skylakegrep"
Issues = "https://github.com/danielchen26/skylakegrep/issues"
Documentation = "https://danielchen26.github.io/skylakegrep/"
Changelog = "https://danielchen26.github.io/skylakegrep/changelog.html"
"Commercial use" = "https://github.com/danielchen26/skylakegrep/blob/master/COMMERCIAL.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["skylakegrep*"]
