<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="cmp-title cmp-desc" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="cmp-title">skylakegrep — comparison matrix vs ripgrep, mgrep, autodev-codebase, Sourcegraph Cody</title>
  <desc id="cmp-desc">Six-axis comparison matrix rendered as a frosted-glass terminal-style card with five tool columns: skylakegrep, ripgrep, mgrep (predecessor), autodev-codebase, Sourcegraph Cody. Axes: concept search, privacy, content types, setup, cost, multilingual.</desc>

  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#13192a"/>
    </linearGradient>
    <linearGradient id="cm-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.075)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.028)"/>
    </linearGradient>
    <linearGradient id="cm-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.32)"/>
      <stop offset="55%"  stop-color="rgba(167,139,250,0.22)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0.22)"/>
    </linearGradient>
    <linearGradient id="cm-self-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.12)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0.05)"/>
    </linearGradient>
    <linearGradient id="cm-gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="cm-orb-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#cm-bg)"/>
  <g filter="url(#cm-orb-blur)" opacity="0.7">
    <circle cx="120"  cy="60"   r="220" fill="rgba(125,211,252,0.16)"/>
    <circle cx="1080" cy="600"  r="220" fill="rgba(167,139,250,0.14)"/>
  </g>

  <!-- Outer frosted card -->
  <g transform="translate(40 40)">
    <rect width="1120" height="540" rx="16" fill="url(#cm-card)" stroke="url(#cm-stroke)" stroke-width="1.2"/>
    <rect width="1120" height="40" rx="16" fill="url(#cm-gleam)"/>
    <line x1="0" y1="40" x2="1120" y2="40" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <!-- macOS traffic lights -->
    <g transform="translate(20 20)">
      <circle cx="0"  cy="0" r="6" fill="#ff5f57"/>
      <circle cx="20" cy="0" r="6" fill="#ffbd2e"/>
      <circle cx="40" cy="0" r="6" fill="#28ca42"/>
    </g>
    <text x="560" y="25" text-anchor="middle" font-size="11.5" fill="#71717a" font-family="ui-monospace, Menlo, Consolas, monospace">skylakegrep — comparison matrix · 2026</text>

    <!-- Header row: tool names -->
    <g transform="translate(0 70)">
      <!-- self-column highlight bg -->
      <rect x="296" y="-22" width="160" height="450" fill="url(#cm-self-col)"/>
      <text x="20"  y="0" font-size="13" fill="#71717a" font-family="ui-monospace, Menlo, Consolas, monospace">Capability</text>
      <text x="376" y="0" text-anchor="middle" font-size="14" fill="#a5f3fc" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">skylakegrep</text>
      <text x="376" y="16" text-anchor="middle" font-size="10" fill="#a5f3fc" opacity="0.75" font-family="ui-monospace, Menlo, Consolas, monospace">v0.5.14</text>
      <text x="528" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8" font-family="ui-monospace, Menlo, Consolas, monospace">ripgrep</text>
      <text x="528" y="16" text-anchor="middle" font-size="10" fill="#71717a" opacity="0.85">lexical baseline</text>
      <text x="664" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8" font-family="ui-monospace, Menlo, Consolas, monospace">mgrep</text>
      <text x="664" y="16" text-anchor="middle" font-size="10" fill="#71717a" opacity="0.85">Mixedbread · paid</text>
      <text x="824" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8" font-family="ui-monospace, Menlo, Consolas, monospace">autodev-codebase</text>
      <text x="824" y="16" text-anchor="middle" font-size="10" fill="#71717a" opacity="0.85">Ollama · CLI</text>
      <text x="996" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8" font-family="ui-monospace, Menlo, Consolas, monospace">Sourcegraph Cody</text>
      <text x="996" y="16" text-anchor="middle" font-size="10" fill="#71717a" opacity="0.85">cloud commercial</text>
    </g>

    <!-- Divider under header -->
    <line x1="20" y1="116" x2="1100" y2="116" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <!-- Row generator: each row is a y-position. Rows: concept · privacy · content · setup · cost · multilingual -->
    <!-- ROW 1: concept-find -->
    <g transform="translate(0 152)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7">Find by <tspan fill="#a5f3fc">concept</tspan>, not just token</text>
      <text x="376" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="528" y="0" text-anchor="middle" font-size="20" fill="#f87171" opacity="0.65" font-weight="700">✗</text>
      <text x="664" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="824" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="996" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
    </g>

    <!-- ROW 2: privacy -->
    <g transform="translate(0 208)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7"><tspan fill="#a5f3fc">Privacy</tspan> — no data egress</text>
      <text x="376" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="528" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="664" y="0" text-anchor="middle" font-size="20" fill="#f87171" opacity="0.65" font-weight="700">✗</text>
      <text x="824" y="0" text-anchor="middle" font-size="20" fill="#34d399" font-weight="700">✓</text>
      <text x="996" y="0" text-anchor="middle" font-size="20" fill="#f87171" opacity="0.65" font-weight="700">✗</text>
    </g>
    <text x="664" y="222" text-anchor="middle" font-size="10" fill="#f87171" opacity="0.75" font-family="ui-monospace, Menlo, Consolas, monospace">cloud-backed store</text>
    <text x="996" y="222" text-anchor="middle" font-size="10" fill="#f87171" opacity="0.75" font-family="ui-monospace, Menlo, Consolas, monospace">cloud index</text>

    <!-- ROW 3: content types -->
    <g transform="translate(0 264)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7"><tspan fill="#a5f3fc">Content</tspan> — multimodal</text>
      <text x="376" y="0" text-anchor="middle" font-size="13" fill="#34d399" font-weight="700">code · md · PDF · docx</text>
      <text x="528" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">text only</text>
      <text x="664" y="0" text-anchor="middle" font-size="13" fill="#34d399">code · text · PDF · img</text>
      <text x="824" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">code-first</text>
      <text x="996" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">code-first</text>
    </g>

    <!-- ROW 4: setup friction -->
    <g transform="translate(0 320)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7"><tspan fill="#a5f3fc">Setup</tspan></text>
      <text x="376" y="0" text-anchor="middle" font-size="13" fill="#34d399" font-weight="700">pip install</text>
      <text x="528" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8">brew install</text>
      <text x="664" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">npm + Mixedbread acct</text>
      <text x="824" y="0" text-anchor="middle" font-size="13" fill="#d4d4d8">npm + Ollama</text>
      <text x="996" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">account + sub</text>
    </g>

    <!-- ROW 5: cost -->
    <g transform="translate(0 376)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7"><tspan fill="#a5f3fc">Cost</tspan></text>
      <text x="376" y="0" text-anchor="middle" font-size="13" fill="#34d399" font-weight="700">$ 0 / mo</text>
      <text x="528" y="0" text-anchor="middle" font-size="13" fill="#34d399">$ 0 / mo</text>
      <text x="664" y="0" text-anchor="middle" font-size="13" fill="#f87171" opacity="0.85">sub + usage-based</text>
      <text x="824" y="0" text-anchor="middle" font-size="13" fill="#34d399">$ 0 / mo</text>
      <text x="996" y="0" text-anchor="middle" font-size="13" fill="#f87171" opacity="0.85">$ 20 – 100+ / mo</text>
    </g>

    <!-- ROW 6: multilingual queries -->
    <g transform="translate(0 432)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="20"  y="0" font-size="13" fill="#e4e4e7"><tspan fill="#a5f3fc">Multilingual</tspan> queries (NL → code id)</text>
      <text x="376" y="0" text-anchor="middle" font-size="13" fill="#34d399" font-weight="700">bge-m3 native</text>
      <text x="528" y="0" text-anchor="middle" font-size="13" fill="#71717a">n/a</text>
      <text x="664" y="0" text-anchor="middle" font-size="13" fill="#34d399">cloud embedder</text>
      <text x="824" y="0" text-anchor="middle" font-size="13" fill="#fbbf24">embedder-dep.</text>
      <text x="996" y="0" text-anchor="middle" font-size="13" fill="#34d399">supported</text>
    </g>

    <!-- Footer note -->
    <line x1="20" y1="478" x2="1100" y2="478" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
    <text x="20" y="510" font-size="11" fill="#71717a" font-family="ui-monospace, Menlo, Consolas, monospace">data: each project's public README · 2026-05 · positions are descriptive, not endorsements</text>
  </g>
</svg>
