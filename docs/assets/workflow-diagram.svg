<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="wf-title wf-desc" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="wf-title">skylakegrep — three-stage local pipeline</title>
  <desc id="wf-desc">Pipeline diagram in soft frosted-glass aesthetic showing query flowing through LLM router, cosine cascade, and proactive layer to produce ranked results — all running locally with zero network calls.</desc>

  <defs>
    <!-- Softer dark gradient for the deep field -->
    <linearGradient id="wf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1018"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>
    <!-- Frosted-glass card fill (very subtle, lifted feel) -->
    <linearGradient id="wf-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.055)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.022)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.012)"/>
    </linearGradient>
    <!-- Multi-stop translucent border (cyan → violet → emerald) — same as hero -->
    <linearGradient id="wf-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.36)"/>
      <stop offset="55%"  stop-color="rgba(167,139,250,0.24)"/>
      <stop offset="100%" stop-color="rgba(94,234,212,0.24)"/>
    </linearGradient>
    <!-- Top edge gleam -->
    <linearGradient id="wf-gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Per-step accent halos -->
    <radialGradient id="wf-cyan-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.32)"/>
      <stop offset="100%" stop-color="rgba(125,211,252,0)"/>
    </radialGradient>
    <radialGradient id="wf-violet-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(167,139,250,0.28)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </radialGradient>
    <radialGradient id="wf-mint-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(94,234,212,0.30)"/>
      <stop offset="100%" stop-color="rgba(94,234,212,0)"/>
    </radialGradient>
    <filter id="wf-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#wf-bg)"/>

  <!-- Ambient blurred colour orbs — softer, more diffuse -->
  <g filter="url(#wf-blur)" opacity="0.55">
    <circle cx="220"  cy="240" r="200" fill="rgba(125,211,252,0.18)"/>
    <circle cx="600"  cy="240" r="200" fill="rgba(167,139,250,0.16)"/>
    <circle cx="980"  cy="240" r="200" fill="rgba(94,234,212,0.16)"/>
  </g>

  <!-- Title strip -->
  <text x="600" y="50" text-anchor="middle" font-size="11.5" letter-spacing="0.18em" fill="rgba(165,243,252,0.6)" font-family="ui-monospace, Menlo, Consolas, monospace">HOW IT WORKS</text>
  <text x="600" y="78" text-anchor="middle" font-size="22" fill="#e8edf2" font-weight="600" letter-spacing="-0.01em">Three local stages. Zero network.</text>

  <!-- =================== Step 1: LLM router =================== -->
  <g transform="translate(48 130)">
    <ellipse cx="170" cy="130" rx="170" ry="160" fill="url(#wf-cyan-halo)" opacity="0.5"/>
    <rect width="340" height="280" rx="18" fill="url(#wf-card)" stroke="url(#wf-stroke)" stroke-width="1.2"/>
    <rect width="340" height="36" rx="18" fill="url(#wf-gleam)"/>
    <line x1="0" y1="36" x2="340" y2="36" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g transform="translate(16 18)">
      <circle cx="0"  cy="0" r="5" fill="#ff5f57" opacity="0.85"/>
      <circle cx="16" cy="0" r="5" fill="#ffbd2e" opacity="0.85"/>
      <circle cx="32" cy="0" r="5" fill="#28ca42" opacity="0.85"/>
    </g>
    <text x="170" y="22" text-anchor="middle" font-size="10.5" fill="rgba(165,243,252,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">stage 1</text>

    <g transform="translate(28 70)">
      <circle cx="14" cy="14" r="14" fill="rgba(125,211,252,0.14)" stroke="rgba(125,211,252,0.45)" stroke-width="1.2"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#7dd3fc" font-family="ui-monospace, Menlo, Consolas, monospace">1</text>
    </g>
    <text x="80" y="92" font-size="20" fill="#e8edf2" font-weight="600" letter-spacing="-0.01em">LLM router</text>
    <text x="80" y="115" font-size="11.5" fill="rgba(165,243,252,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">qwen2.5:3b · ~ 50 ms</text>

    <text x="28" y="160" font-size="13" fill="#c8d0d8">Classifies <tspan fill="#a5f3fc">intent</tspan>,</text>
    <text x="28" y="180" font-size="13" fill="#c8d0d8"><tspan fill="#a5f3fc">scope</tspan>, and <tspan fill="#a5f3fc">primary token</tspan></text>
    <text x="28" y="200" font-size="13" fill="#c8d0d8">in one local LLM call.</text>
    <text x="28" y="226" font-size="12.5" fill="#94a0aa">Persistent SQLite cache —</text>
    <text x="28" y="244" font-size="12.5" fill="#94a0aa">no LLM cost on repeats.</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <g transform="translate(396 270)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="26,-6 34,0 26,6" fill="none" stroke="rgba(167,139,250,0.85)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- =================== Step 2: Cosine cascade =================== -->
  <g transform="translate(440 130)">
    <ellipse cx="170" cy="130" rx="170" ry="160" fill="url(#wf-violet-halo)" opacity="0.5"/>
    <rect width="340" height="280" rx="18" fill="url(#wf-card)" stroke="url(#wf-stroke)" stroke-width="1.2"/>
    <rect width="340" height="36" rx="18" fill="url(#wf-gleam)"/>
    <line x1="0" y1="36" x2="340" y2="36" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g transform="translate(16 18)">
      <circle cx="0"  cy="0" r="5" fill="#ff5f57" opacity="0.85"/>
      <circle cx="16" cy="0" r="5" fill="#ffbd2e" opacity="0.85"/>
      <circle cx="32" cy="0" r="5" fill="#28ca42" opacity="0.85"/>
    </g>
    <text x="170" y="22" text-anchor="middle" font-size="10.5" fill="rgba(216,180,254,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">stage 2</text>

    <g transform="translate(28 70)">
      <circle cx="14" cy="14" r="14" fill="rgba(167,139,250,0.16)" stroke="rgba(167,139,250,0.50)" stroke-width="1.2"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd" font-family="ui-monospace, Menlo, Consolas, monospace">2</text>
    </g>
    <text x="80" y="92" font-size="20" fill="#e8edf2" font-weight="600" letter-spacing="-0.01em">Cosine cascade</text>
    <text x="80" y="115" font-size="11.5" fill="rgba(216,180,254,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">bge-m3 · 0.5 – 2 s</text>

    <text x="28" y="160" font-size="13" fill="#c8d0d8"><tspan fill="#c4b5fd">σ-adaptive</tspan> early-exit:</text>
    <text x="28" y="180" font-size="13" fill="#c8d0d8">cheap file-mean cosine</text>
    <text x="28" y="200" font-size="13" fill="#c8d0d8">→ HyDE → cross-encoder.</text>
    <text x="28" y="226" font-size="12.5" fill="#94a0aa">Bayesian framing:</text>
    <text x="28" y="244" font-size="11.5" fill="#94a0aa" font-family="ui-monospace, Menlo, Consolas, monospace">τ_eff = max(τ_floor, k·σ_topK)</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <g transform="translate(788 270)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="rgba(94,234,212,0.55)" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="26,-6 34,0 26,6" fill="none" stroke="rgba(94,234,212,0.85)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- =================== Step 3: Proactive layer =================== -->
  <g transform="translate(832 130)">
    <ellipse cx="170" cy="130" rx="170" ry="160" fill="url(#wf-mint-halo)" opacity="0.5"/>
    <rect width="320" height="280" rx="18" fill="url(#wf-card)" stroke="url(#wf-stroke)" stroke-width="1.2"/>
    <rect width="320" height="36" rx="18" fill="url(#wf-gleam)"/>
    <line x1="0" y1="36" x2="320" y2="36" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g transform="translate(16 18)">
      <circle cx="0"  cy="0" r="5" fill="#ff5f57" opacity="0.85"/>
      <circle cx="16" cy="0" r="5" fill="#ffbd2e" opacity="0.85"/>
      <circle cx="32" cy="0" r="5" fill="#28ca42" opacity="0.85"/>
    </g>
    <text x="160" y="22" text-anchor="middle" font-size="10.5" fill="rgba(167,243,208,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">stage 3</text>

    <g transform="translate(28 70)">
      <circle cx="14" cy="14" r="14" fill="rgba(94,234,212,0.16)" stroke="rgba(94,234,212,0.50)" stroke-width="1.2"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace">3</text>
    </g>
    <text x="80" y="92" font-size="20" fill="#e8edf2" font-weight="600" letter-spacing="-0.01em">Proactive layer</text>
    <text x="80" y="115" font-size="11.5" fill="rgba(167,243,208,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">2 s budget · parallel</text>

    <text x="28" y="160" font-size="13" fill="#c8d0d8">When cascade can't answer,</text>
    <text x="28" y="180" font-size="13" fill="#c8d0d8">runs <tspan fill="#5eead4">filename_extend</tspan> +</text>
    <text x="28" y="200" font-size="13" fill="#c8d0d8"><tspan fill="#5eead4">recovery_progress_hint</tspan>.</text>
    <text x="28" y="226" font-size="12.5" fill="#94a0aa">Bounded extra work in</text>
    <text x="28" y="244" font-size="12.5" fill="#94a0aa">parallel — never silent.</text>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(0 440)">
    <rect width="1200" height="40" fill="rgba(255,255,255,0.014)"/>
    <text x="600" y="25" text-anchor="middle" font-size="12.5" fill="rgba(200,208,216,0.85)" font-family="ui-monospace, Menlo, Consolas, monospace">Local Ollama  ·  Local SQLite  ·  Zero network calls  ·  Zero subscription</text>
  </g>
</svg>
