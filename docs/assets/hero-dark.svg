<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="hero-title hero-desc" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="hero-title">skylakegrep — fully-offline semantic search over your local files</title>
  <desc id="hero-desc">Brand block with the skylakegrep wordmark and tagline sitting above a frosted-glass mock terminal window that shows the command "skygrep search how does the auth token get refreshed -m 3" followed by three ranked code snippets with file path, line range, language pill, and similarity score.</desc>

  <defs>
    <!-- Soft frosted-glass card fill (lighter on top, darker at bottom) -->
    <linearGradient id="glass-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.045)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.025)"/>
    </linearGradient>

    <!-- Translucent multi-stop stroke (cyan top → violet → emerald) -->
    <linearGradient id="glass-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.32)"/>
      <stop offset="55%"  stop-color="rgba(167,139,250,0.22)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0.22)"/>
    </linearGradient>

    <!-- Top edge highlight (a thin "glass thickness" gleam) -->
    <linearGradient id="top-gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Result-card glass (slightly more transparent than outer card) -->
    <linearGradient id="result-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.085)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.028)"/>
    </linearGradient>

    <!-- Wordmark gradient (white → ice cyan) -->
    <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Soft Gaussian blur for ambient orbs in the background -->
    <filter id="orb-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <!-- =================== Background =================== -->
  <!-- Deep navy base -->
  <rect width="1280" height="620" fill="#0e1320"/>

  <!-- Ambient blurred colour orbs (the "atmosphere" behind glass) -->
  <g filter="url(#orb-blur)">
    <circle cx="180"  cy="80"  r="280" fill="rgba(125,211,252,0.18)"/>
    <circle cx="1100" cy="140" r="240" fill="rgba(167,139,250,0.18)"/>
    <circle cx="640"  cy="620" r="320" fill="rgba(52,211,153,0.10)"/>
  </g>

  <!-- Subtle vignette to focus the eye on the centre -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="50%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
  </radialGradient>
  <rect width="1280" height="620" fill="url(#vignette)"/>

  <!-- =================== Brand block =================== -->
  <!-- Search-glass mark, centred above the wordmark -->
  <g transform="translate(614 36)">
    <rect width="36" height="36" rx="9" fill="rgba(125,211,252,0.12)" stroke="rgba(125,211,252,0.36)" stroke-width="1"/>
    <g fill="none" stroke="#a5f3fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 2)">
      <circle cx="14" cy="14" r="6"/>
      <line x1="19" y1="19" x2="27" y2="27"/>
    </g>
  </g>

  <!-- Wordmark — moved down so cap-top clears the mark -->
  <text x="640" y="120" text-anchor="middle" font-size="48" font-weight="700" fill="url(#brand-grad)" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" letter-spacing="-0.025em">skylakegrep</text>

  <!-- Subtitle — generous gap so descenders never clip subtitle ascenders -->
  <text x="640" y="160" text-anchor="middle" font-size="16" fill="#cbd5e1" opacity="0.85">Semantic search over your local files — fully offline.</text>

  <!-- Pill row — pushed lower for breathing room -->
  <g font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#71717a" text-anchor="middle">
    <text x="640" y="190" fill="#a5f3fc">v0.7.0  ·  PolyForm-NC-1.0.0  ·  Python 3.9+  ·  powered by Ollama</text>
  </g>

  <!-- =================== Frosted-glass terminal card =================== -->
  <g transform="translate(80 220)">
    <!-- Card body: translucent fill + multi-stop stroke -->
    <rect width="1120" height="380" rx="16" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1.2"/>
    <!-- Top "thickness" gleam, 1px-tall highlight at the top edge -->
    <rect width="1120" height="42" rx="16" fill="url(#top-gleam)"/>

    <!-- Chrome bar (transparent, just hosts dots + cwd) -->
    <line x1="0" y1="40" x2="1120" y2="40" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <g transform="translate(20 20)">
      <circle cx="0"  cy="0" r="6" fill="#3f4759"/>
      <circle cx="20" cy="0" r="6" fill="#3f4759"/>
      <circle cx="40" cy="0" r="6" fill="#3f4759"/>
    </g>
    <text x="560" y="25" text-anchor="middle" font-size="11.5" fill="#71717a" font-family="ui-monospace, Menlo, Consolas, monospace">~/projects/api · zsh</text>

    <!-- Body -->
    <g transform="translate(28 64)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <!-- Command line -->
      <text font-size="14" fill="#71717a">$</text>
      <text x="20"  font-size="14" fill="#e4e4e7">skygrep search </text>
      <text x="160" font-size="14" fill="#a5f3fc">"how does the auth token get refreshed?"</text>
      <text x="568" font-size="14" fill="#71717a"> -m 3</text>

      <!-- Result 1 — translucent glass card -->
      <g transform="translate(0 28)">
        <rect width="1064" height="80" rx="10" fill="url(#result-glass)" stroke="rgba(255,255,255,0.10)"/>
        <text x="16" y="22" font-size="12.5" fill="#a5f3fc">auth/refresh.py</text>
        <text x="138" y="22" font-size="12.5" fill="#71717a">:34-51</text>
        <rect x="936" y="9" width="56" height="20" rx="6" fill="rgba(125,211,252,0.10)" stroke="rgba(125,211,252,0.28)"/>
        <text x="964" y="23" text-anchor="middle" font-size="11" fill="#a5f3fc">python</text>
        <text x="1004" y="22" font-size="12" fill="#71717a">·</text>
        <text x="1018" y="22" font-size="12.5" fill="#34d399" font-weight="700">0.93</text>
        <text x="16" y="44" font-size="12.5" fill="#d4d4d8">def <tspan fill="#a5f3fc">refresh_token</tspan>(refresh_jwt: <tspan fill="#fde68a">str</tspan>) -&gt; <tspan fill="#fde68a">AccessToken</tspan>:</text>
        <text x="16" y="62" font-size="12.5" fill="#a1a1aa">    claims = jwt.decode(refresh_jwt, key, algorithms=ALGS)</text>
      </g>

      <!-- Result 2 -->
      <g transform="translate(0 124)">
        <rect width="1064" height="80" rx="10" fill="url(#result-glass)" stroke="rgba(255,255,255,0.10)"/>
        <text x="16" y="22" font-size="12.5" fill="#a5f3fc">auth/middleware.py</text>
        <text x="166" y="22" font-size="12.5" fill="#71717a">:78-94</text>
        <rect x="936" y="9" width="56" height="20" rx="6" fill="rgba(125,211,252,0.10)" stroke="rgba(125,211,252,0.28)"/>
        <text x="964" y="23" text-anchor="middle" font-size="11" fill="#a5f3fc">python</text>
        <text x="1004" y="22" font-size="12" fill="#71717a">·</text>
        <text x="1018" y="22" font-size="12.5" fill="#34d399" font-weight="700">0.81</text>
        <text x="16" y="44" font-size="12.5" fill="#d4d4d8">async def <tspan fill="#a5f3fc">renew_session</tspan>(req: <tspan fill="#fde68a">Request</tspan>) -&gt; <tspan fill="#fde68a">Response</tspan>:</text>
        <text x="16" y="62" font-size="12.5" fill="#a1a1aa">    if req.cookies.get(<tspan fill="#86efac">"rt"</tspan>) and access_expired(req):</text>
      </g>

      <!-- Result 3 -->
      <g transform="translate(0 220)">
        <rect width="1064" height="80" rx="10" fill="url(#result-glass)" stroke="rgba(255,255,255,0.10)"/>
        <text x="16" y="22" font-size="12.5" fill="#a5f3fc">utils/jwt.py</text>
        <text x="120" y="22" font-size="12.5" fill="#71717a">:22-39</text>
        <rect x="936" y="9" width="56" height="20" rx="6" fill="rgba(125,211,252,0.10)" stroke="rgba(125,211,252,0.28)"/>
        <text x="964" y="23" text-anchor="middle" font-size="11" fill="#a5f3fc">python</text>
        <text x="1004" y="22" font-size="12" fill="#71717a">·</text>
        <text x="1018" y="22" font-size="12.5" fill="#34d399" font-weight="700">0.74</text>
        <text x="16" y="44" font-size="12.5" fill="#d4d4d8">def <tspan fill="#a5f3fc">decode_jwt</tspan>(token: <tspan fill="#fde68a">str</tspan>, *, verify: <tspan fill="#fde68a">bool</tspan> = <tspan fill="#fbbf24">True</tspan>) -&gt; <tspan fill="#fde68a">dict</tspan>:</text>
        <text x="16" y="62" font-size="12.5" fill="#a1a1aa">    parts = token.split(<tspan fill="#86efac">"."</tspan>)</text>
      </g>
    </g>
  </g>
</svg>
