<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="og-title">skylakegrep — fully-offline semantic search over your local files</title>
  <desc id="og-desc">Frosted-glass social preview card for skylakegrep showing the wordmark, tagline, three performance highlights (multi-turn tool-call reduction, warm query latency, fully local), and the latest version.</desc>

  <defs>
    <!-- Frosted-glass tile fill (lighter top, darker bottom) -->
    <linearGradient id="glass-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.045)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.025)"/>
    </linearGradient>

    <!-- Multi-stop translucent stroke -->
    <linearGradient id="tile-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(103,232,249,0.45)"/>
      <stop offset="55%"  stop-color="rgba(167,139,250,0.25)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0.25)"/>
    </linearGradient>

    <!-- Top "thickness" gleam for each glass card -->
    <linearGradient id="top-gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Soft Gaussian blur for ambient orbs -->
    <filter id="orb-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <!-- Center-focused vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="50%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
    </radialGradient>
  </defs>

  <!-- =================== Background =================== -->
  <rect width="1200" height="630" fill="#0e1320"/>

  <!-- Ambient blurred orbs -->
  <g filter="url(#orb-blur)">
    <circle cx="170"  cy="80"  r="300" fill="rgba(34,211,238,0.24)"/>
    <circle cx="1030" cy="120" r="260" fill="rgba(167,139,250,0.20)"/>
    <circle cx="600"  cy="650" r="340" fill="rgba(52,211,153,0.12)"/>
  </g>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- =================== Brand block =================== -->
  <!-- Search-glass mark, slightly lifted -->
  <g transform="translate(560 70)">
    <rect width="80" height="80" rx="22" fill="rgba(125,211,252,0.12)" stroke="rgba(125,211,252,0.36)" stroke-width="1.5"/>
    <g fill="none" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(8 8)">
      <circle cx="28" cy="28" r="14"/>
      <line x1="38" y1="38" x2="56" y2="56"/>
    </g>
  </g>

  <!-- Wordmark — moved up slightly -->
  <text x="600" y="252" text-anchor="middle" font-size="84" font-weight="700" fill="url(#brand-grad)" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" letter-spacing="-0.025em">skylakegrep</text>

  <!-- Tagline — pushed down for breathing room from wordmark descenders -->
  <text x="600" y="312" text-anchor="middle" font-size="22" fill="#cbd5e1" opacity="0.85">Semantic search over your local files — fully offline.</text>

  <!-- =================== Stat tiles (frosted glass) =================== -->
  <g font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
    <!-- Tile 1: multi-turn tool calls -->
    <g transform="translate(120 388)">
      <rect width="300" height="130" rx="16" fill="url(#glass-tile)" stroke="url(#tile-stroke)" stroke-width="1.2"/>
      <rect width="300" height="38" rx="16" fill="url(#top-gleam)"/>
      <text x="150" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="0.08em">MULTI-TURN TOOL CALLS</text>
      <text x="150" y="92" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">−82 %</text>
      <text x="150" y="115" text-anchor="middle" font-size="12" fill="#71717a">3-turn Rust workspace session · Claude Code</text>
    </g>

    <!-- Tile 2: warm query -->
    <g transform="translate(450 388)">
      <rect width="300" height="130" rx="16" fill="url(#glass-tile)" stroke="url(#tile-stroke)" stroke-width="1.2"/>
      <rect width="300" height="38" rx="16" fill="url(#top-gleam)"/>
      <text x="150" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="0.08em">WARM QUERY</text>
      <text x="150" y="92" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">~0.5 s</text>
      <text x="150" y="115" text-anchor="middle" font-size="12" fill="#71717a">cheap-path cascade · Mac CPU</text>
    </g>

    <!-- Tile 3: everything local -->
    <g transform="translate(780 388)">
      <rect width="300" height="130" rx="16" fill="url(#glass-tile)" stroke="url(#tile-stroke)" stroke-width="1.2"/>
      <rect width="300" height="38" rx="16" fill="url(#top-gleam)"/>
      <text x="150" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="0.08em">EVERYTHING LOCAL</text>
      <text x="150" y="92" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">100%</text>
      <text x="150" y="115" text-anchor="middle" font-size="12" fill="#71717a">no remote service · NC license</text>
    </g>
  </g>

  <!-- =================== Bottom row: install line + version =================== -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#71717a" text-anchor="middle">
    <text x="600" y="582" fill="#a5f3fc">pip install skylakegrep  ·  v0.5.14  ·  Python 3.9+  ·  powered by Ollama</text>
  </g>
</svg>
