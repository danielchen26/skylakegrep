<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="cfg-title cfg-desc" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="cfg-title">skylakegrep — environment variable configuration</title>
  <desc id="cfg-desc">Configuration reference rendered as a frosted-glass card with three grouped panels: Ollama setup (URL, embed model, LLM model, HyDE model, keep-alive), Indexing &amp; rerank (DB path, auto-pull, refresh throttle, rerank model, rerank pool), and Behavior toggles (no-hints, no-proactive, proactive budget, footer compact).</desc>

  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13192a"/>
      <stop offset="100%" stop-color="#181f33"/>
    </linearGradient>
    <linearGradient id="cf-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.085)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.040)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.025)"/>
    </linearGradient>
    <linearGradient id="cf-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.34)"/>
      <stop offset="55%"  stop-color="rgba(167,139,250,0.22)"/>
      <stop offset="100%" stop-color="rgba(94,234,212,0.22)"/>
    </linearGradient>
    <linearGradient id="cf-group-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(125,211,252,0.10)"/>
      <stop offset="100%" stop-color="rgba(125,211,252,0.025)"/>
    </linearGradient>
    <linearGradient id="cf-group-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(167,139,250,0.10)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0.025)"/>
    </linearGradient>
    <linearGradient id="cf-group-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(94,234,212,0.10)"/>
      <stop offset="100%" stop-color="rgba(94,234,212,0.025)"/>
    </linearGradient>
    <linearGradient id="cf-gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="cf-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#cf-bg)"/>
  <g filter="url(#cf-blur)" opacity="0.55">
    <circle cx="180"  cy="100" r="240" fill="rgba(125,211,252,0.16)"/>
    <circle cx="1020" cy="600" r="220" fill="rgba(94,234,212,0.14)"/>
  </g>

  <g transform="translate(40 40)">
    <rect width="1120" height="620" rx="20" fill="url(#cf-card)" stroke="url(#cf-stroke)" stroke-width="1.2"/>
    <rect width="1120" height="40" rx="20" fill="url(#cf-gleam)"/>
    <line x1="0" y1="40" x2="1120" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g transform="translate(20 20)">
      <circle cx="0"  cy="0" r="5" fill="#ff5f57" opacity="0.85"/>
      <circle cx="20" cy="0" r="5" fill="#ffbd2e" opacity="0.85"/>
      <circle cx="40" cy="0" r="5" fill="#28ca42" opacity="0.85"/>
    </g>
    <text x="560" y="25" text-anchor="middle" font-size="11" fill="rgba(165,243,252,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">configuration · environment variables · v0.5.7</text>

    <text x="40" y="80" font-size="11" letter-spacing="0.18em" fill="rgba(165,243,252,0.6)" font-family="ui-monospace, Menlo, Consolas, monospace">ENV VAR REFERENCE</text>
    <text x="40" y="106" font-size="20" fill="#e8edf2" font-weight="600" letter-spacing="-0.01em">Defaults work. Tune only when you need to.</text>

    <!-- ============== Group 1: Ollama setup (cyan) ============== -->
    <g transform="translate(40 138)">
      <rect width="340" height="450" rx="14" fill="url(#cf-group-cyan)" stroke="rgba(125,211,252,0.26)"/>
      <text x="20" y="30" font-size="11" letter-spacing="0.14em" fill="rgba(165,243,252,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">OLLAMA SETUP</text>
      <text x="20" y="56" font-size="15" fill="#e8edf2" font-weight="600">Where the local models live.</text>
      <line x1="20" y1="74" x2="320" y2="74" stroke="rgba(125,211,252,0.16)"/>

      <g font-family="ui-monospace, Menlo, Consolas, monospace">
        <text x="20" y="100" font-size="12" fill="#a5f3fc" font-weight="600">OLLAMA_URL</text>
        <text x="20" y="118" font-size="11" fill="#94a0aa">http://localhost:11434</text>

        <text x="20" y="148" font-size="12" fill="#a5f3fc" font-weight="600">OLLAMA_EMBED_MODEL</text>
        <text x="20" y="166" font-size="11" fill="#94a0aa">bge-m3 · auto-detected switch</text>

        <text x="20" y="196" font-size="12" fill="#a5f3fc" font-weight="600">OLLAMA_LLM_MODEL</text>
        <text x="20" y="214" font-size="11" fill="#94a0aa">qwen2.5:3b · router + answers</text>

        <text x="20" y="244" font-size="12" fill="#a5f3fc" font-weight="600">OLLAMA_HYDE_MODEL</text>
        <text x="20" y="262" font-size="11" fill="#94a0aa">qwen2.5:3b · cascade rewrite</text>

        <text x="20" y="292" font-size="12" fill="#a5f3fc" font-weight="600">OLLAMA_KEEP_ALIVE</text>
        <text x="20" y="310" font-size="11" fill="#94a0aa">-1 · models resident forever</text>
      </g>

      <text x="20" y="348" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">Switching the embedder is</text>
      <text x="20" y="366" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">auto-detected from 0.2.2 on —</text>
      <text x="20" y="384" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">no manual <tspan fill="#a5f3fc" font-family="ui-monospace, Menlo, Consolas, monospace">--reset</tspan> needed.</text>

      <text x="20" y="416" font-size="11" fill="rgba(165,243,252,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">5 vars · Ollama side</text>
    </g>

    <!-- ============== Group 2: Indexing &amp; rerank (violet) ============== -->
    <g transform="translate(400 138)">
      <rect width="340" height="450" rx="14" fill="url(#cf-group-violet)" stroke="rgba(167,139,250,0.26)"/>
      <text x="20" y="30" font-size="11" letter-spacing="0.14em" fill="rgba(216,180,254,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">INDEXING &amp; RERANK</text>
      <text x="20" y="56" font-size="15" fill="#e8edf2" font-weight="600">How the cascade behaves.</text>
      <line x1="20" y1="74" x2="320" y2="74" stroke="rgba(167,139,250,0.16)"/>

      <g font-family="ui-monospace, Menlo, Consolas, monospace">
        <text x="20" y="100" font-size="12" fill="#c4b5fd" font-weight="600">SKYGREP_DB_PATH</text>
        <text x="20" y="118" font-size="11" fill="#94a0aa">per-project · curated index mode</text>

        <text x="20" y="148" font-size="12" fill="#c4b5fd" font-weight="600">SKYGREP_AUTO_PULL</text>
        <text x="20" y="166" font-size="11" fill="#94a0aa">unset · set "yes" → auto-pull</text>

        <text x="20" y="196" font-size="12" fill="#c4b5fd" font-weight="600">SKYGREP_AUTO_REFRESH_</text>
        <text x="20" y="214" font-size="12" fill="#c4b5fd" font-weight="600">THROTTLE_SECONDS</text>
        <text x="20" y="232" font-size="11" fill="#94a0aa">30 · skip mtime scan if recent</text>

        <text x="20" y="262" font-size="12" fill="#c4b5fd" font-weight="600">SKYGREP_RERANK_MODEL</text>
        <text x="20" y="280" font-size="11" fill="#94a0aa">mxbai-rerank-large-v2</text>

        <text x="20" y="310" font-size="12" fill="#c4b5fd" font-weight="600">SKYGREP_RERANK_POOL</text>
        <text x="20" y="328" font-size="11" fill="#94a0aa">50 · candidate pool</text>
      </g>

      <text x="20" y="366" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">Most users never touch these —</text>
      <text x="20" y="384" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">defaults are tuned per the</text>
      <text x="20" y="402" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">public-OSS bench.</text>

      <text x="20" y="430" font-size="11" fill="rgba(216,180,254,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">5 vars · cascade tuning</text>
    </g>

    <!-- ============== Group 3: Behavior toggles (mint) ============== -->
    <g transform="translate(760 138)">
      <rect width="340" height="450" rx="14" fill="url(#cf-group-mint)" stroke="rgba(94,234,212,0.26)"/>
      <text x="20" y="30" font-size="11" letter-spacing="0.14em" fill="rgba(167,243,208,0.7)" font-family="ui-monospace, Menlo, Consolas, monospace">BEHAVIOR TOGGLES</text>
      <text x="20" y="56" font-size="15" fill="#e8edf2" font-weight="600">Opt out of the helpers.</text>
      <line x1="20" y1="74" x2="320" y2="74" stroke="rgba(94,234,212,0.16)"/>

      <g font-family="ui-monospace, Menlo, Consolas, monospace">
        <text x="20" y="100" font-size="12" fill="#5eead4" font-weight="600">SKYGREP_NO_HINTS</text>
        <text x="20" y="118" font-size="11" fill="#94a0aa">unset · 1 → silence all hints</text>

        <text x="20" y="148" font-size="12" fill="#5eead4" font-weight="600">SKYGREP_NO_PROACTIVE</text>
        <text x="20" y="166" font-size="11" fill="#94a0aa">unset · 1 → disable framework</text>

        <text x="20" y="196" font-size="12" fill="#5eead4" font-weight="600">SKYGREP_PROACTIVE_</text>
        <text x="20" y="214" font-size="12" fill="#5eead4" font-weight="600">BUDGET_MS</text>
        <text x="20" y="232" font-size="11" fill="#94a0aa">2000 · wall-clock cap per query</text>

        <text x="20" y="262" font-size="12" fill="#5eead4" font-weight="600">SKYGREP_FOOTER_COMPACT</text>
        <text x="20" y="280" font-size="11" fill="#94a0aa">unset · 1 → legacy 1-line footer</text>
      </g>

      <text x="20" y="318" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">Hints, proactive enhancers, and</text>
      <text x="20" y="336" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">the multi-line telemetry footer</text>
      <text x="20" y="354" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">are all on by default. Turn off</text>
      <text x="20" y="372" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">individually if you prefer the</text>
      <text x="20" y="390" font-size="11" fill="#c8d0d8" font-family="Inter, sans-serif">quieter agent-loop output.</text>

      <text x="20" y="430" font-size="11" fill="rgba(167,243,208,0.55)" font-family="ui-monospace, Menlo, Consolas, monospace">4 vars · UX preferences</text>
    </g>
  </g>
</svg>
